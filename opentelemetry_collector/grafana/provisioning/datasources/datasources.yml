# Grafana data sources: one pane over logs, metrics, and traces.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki   # fixed uid so provisioned alert rules can reference it
    access: proxy
    url: http://loki:3100
    isDefault: true

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
